<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibes CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        
        .input-minimal {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0;
            padding: 8px 0;
            color: white;
            transition: all 0.2s;
        }
        .input-minimal:focus {
            outline: none;
            border-bottom-color: rgba(255, 255, 255, 0.8);
            box-shadow: none;
        }
        .input-minimal::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        
        .status-answered {
            color: #a7f3d0;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.05);
        }
        .status-pending {
            color: #a1a1aa;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#050505] text-gray-300 min-h-screen selection:bg-white/20 overflow-x-hidden">

    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-500/5 blur-[100px] pointer-events-none"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-blue-500/5 blur-[100px] pointer-events-none"></div>

    <div class="max-w-5xl mx-auto px-6 py-16 relative z-10">
        
        <header class="flex justify-between items-center mb-16">
            <div>
                <h1 class="text-3xl font-medium text-white tracking-tight flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></div>
                    Vibes CRM
                </h1>
                <p class="text-sm text-gray-500 mt-2">Personal localized CRM. Your data stays in your browser.</p>
            </div>
            <div class="flex gap-4">
                <button onclick="exportData()" class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/5 text-sm text-gray-300 transition-all flex items-center gap-2">
                    <i data-feather="download" class="w-4 h-4"></i> Export CSV
                </button>
            </div>
        </header>

        <div class="mb-12 p-6 glass-panel rounded-2xl">
            <form id="addClientForm" class="flex flex-col md:flex-row md:items-end gap-6">
                <div class="flex-1">
                    <label class="block text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-2">Name</label>
                    <input type="text" id="name" placeholder="John Doe" class="input-minimal w-full text-sm font-medium" required>
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-2">Contact</label>
                    <input type="text" id="contact" placeholder="@telegram or mail" class="input-minimal w-full text-sm font-medium" required>
                </div>
                <div class="flex-1">
                    <label class="block text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-2">Source</label>
                    <input type="text" id="source" placeholder="Maps, TG Ads..." class="input-minimal w-full text-sm font-medium" required>
                </div>
                <div>
                    <button type="submit" class="w-full md:w-auto bg-white text-black hover:bg-gray-200 text-sm font-medium py-2.5 px-6 rounded-lg transition-all flex items-center justify-center gap-2">
                        <i data-feather="plus" class="w-4 h-4"></i> Add
                    </button>
                </div>
            </form>
        </div>

        <div class="glass-panel rounded-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-white/5 text-[10px] uppercase tracking-[0.15em] text-gray-500">
                        <th class="px-8 py-5 font-medium">Client</th>
                        <th class="px-8 py-5 font-medium">Contact</th>
                        <th class="px-8 py-5 font-medium">Source</th>
                        <th class="px-8 py-5 font-medium">Date</th>
                        <th class="px-8 py-5 font-medium text-right">Status</th>
                    </tr>
                </thead>
                <tbody id="clientsTableBody" class="text-sm">
                    <!-- JS Rows -->
                </tbody>
            </table>
            
            <div id="emptyState" class="hidden py-16 text-center text-gray-500 text-sm flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center mb-4">
                    <i data-feather="inbox" class="w-5 h-5 opacity-60"></i>
                </div>
                No leads found. Waiting for incoming data.
            </div>
        </div>
    </div>

    <script>
        feather.replace();
        
        let clients = JSON.parse(localStorage.getItem('vibesClients')) || [];

        document.addEventListener('DOMContentLoaded', renderClients);

        document.getElementById('addClientForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const contactVal = document.getElementById('contact').value;
            let email = '', telegram = '';
            if (contactVal.includes('@') && !contactVal.startsWith('@')) {
                email = contactVal;
            } else {
                telegram = contactVal.startsWith('@') ? contactVal : '@' + contactVal;
            }

            const newClient = {
                id: Date.now(),
                name: document.getElementById('name').value,
                email: email,
                telegram: telegram,
                source: document.getElementById('source').value,
                status: 'Pending',
                created_at: new Date().toISOString()
            };

            clients.unshift(newClient);
            saveData();
            
            document.getElementById('addClientForm').reset();
            renderClients();
        });

        function renderClients() {
            const tbody = document.getElementById('clientsTableBody');
            const emptyState = document.getElementById('emptyState');
            
            tbody.innerHTML = '';
            
            if (clients.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            clients.forEach((c, index) => {
                const isAnswered = c.status === 'Answered';
                const statusClass = isAnswered ? 'status-answered' : 'status-pending';
                const statusText = isAnswered ? 'Done' : 'Pending';
                const icon = isAnswered ? 'check' : 'clock';
                
                const contactDisplay = c.telegram ? c.telegram : (c.email ? c.email : '—');
                
                const dateObj = new Date(c.created_at);
                const dateStr = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                const rowIdStr = c.id ? String(c.id).slice(-4) : String(index).padStart(4, '0');

                const row = `
                    <tr class="border-b border-white/5 hover:bg-white/[0.02] transition-colors group">
                        <td class="px-8 py-5">
                            <div class="font-medium text-gray-200">${c.name || 'Unknown'}</div>
                            <div class="text-[10px] text-gray-600 font-mono mt-1 opacity-70 group-hover:opacity-100 transition-opacity">#${rowIdStr}</div>
                        </td>
                        <td class="px-8 py-5 text-gray-400 text-[13px]">${contactDisplay}</td>
                        <td class="px-8 py-5">
                            <span class="px-2.5 py-1 rounded-md bg-white/5 border border-white/5 text-[11px] text-gray-400 tracking-wide">${c.source || '—'}</span>
                        </td>
                        <td class="px-8 py-5 text-gray-500 text-[13px]">${dateStr}</td>
                        <td class="px-8 py-5 text-right flex items-center justify-end gap-3">
                            <button onclick="toggleStatus(${c.id})" 
                                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-medium transition-all ${statusClass} hover:opacity-80 cursor-pointer">
                                <i data-feather="${icon}" class="w-3 h-3"></i>
                                ${statusText}
                            </button>
                            <button onclick="deleteClient(${c.id})" class="text-red-500/50 hover:text-red-500 transition-colors">
                                <i data-feather="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
            feather.replace();
        }

        function toggleStatus(id) {
            const client = clients.find(c => c.id === id);
            if(client) {
                client.status = client.status === 'Answered' ? 'Pending' : 'Answered';
                saveData();
                renderClients();
            }
        }

        function deleteClient(id) {
            if(confirm('Are you sure you want to delete this lead?')) {
                clients = clients.filter(c => c.id !== id);
                saveData();
                renderClients();
            }
        }

        function saveData() {
            localStorage.setItem('vibesClients', JSON.stringify(clients));
        }

        function exportData() {
            let csvContent = "data:text/csv;charset=utf-8,Name,Contact,Source,Status,Date\n";
            clients.forEach(c => {
                const contact = c.telegram ? c.telegram : c.email;
                const dateStr = new Date(c.created_at).toLocaleDateString();
                const row = `"${c.name}","${contact}","${c.source}","${c.status}","${dateStr}"`;
                csvContent += row + "\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "vibes-clients.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
